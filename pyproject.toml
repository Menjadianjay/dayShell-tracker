[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dayshell"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["gspread", "pandas", "supabase", "python-dotenv"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dayshell = ["schema.sql"]